<!DOCTYPE html>
<html>
    <head>
        <title>Audio And Video In HTML</title>
    </head>
    <body>
        <center>
            <h2>This is one of my favourite song</h2>
            <audio controls>
                <source src="audio.mp3"
                type="audio/mp3">
            </audio>
            <h2>This is one of my favourite video</h2>
            <video controls  width="400" height="200">
                <source src="video.mp4"
                type="video/mp4">
            </video>
        </center>
    </body>
</html>
